<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="16" y1="14" x2="110" y2="114" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5AB4FF"/>
      <stop offset="1" stop-color="#295AAE"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="128" height="128" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feOffset dy="6"/>
      <feGaussianBlur stdDeviation="4"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.08 0 0 0 0 0.12 0 0 0 0 0.22 0 0 0 0.45 0"/>
      <feBlend in2="SourceGraphic" result="shape"/>
    </filter>
    <filter id="letterShadow" x="0" y="0" width="128" height="128" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feOffset dx="-3" dy="5"/>
      <feGaussianBlur stdDeviation="1.2"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.11 0 0 0 0 0.18 0 0 0 0 0.34 0 0 0 0.55 0"/>
      <feBlend in2="SourceGraphic" result="shape"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="9" y="7" width="110" height="110" rx="12" fill="url(#bg)"/>
  </g>
  <g filter="url(#letterShadow)">
    <text x="16" y="84" fill="#F5F8FF" font-family="Arial, Helvetica, sans-serif" font-size="60" font-weight="900" letter-spacing="-4">AJ.</text>
  </g>
</svg>
